<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <!-- Filtreler ve Gölgeler -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Kavisli Yazı Yolları -->
    <path id="text-arc-top" d="M 50,210 A 200,160 0 0,1 450,210" fill="none" />
  </defs>

  <!-- Arka Plan Zemin (İsteğe bağlı şeffaf, kontur verir) -->
  <g id="logo-emblem" filter="url(#drop-shadow)">
    
    <!-- ÜST KAVİSLİ METİN: EMEK CİĞERCİSİ -->
    <text font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#C1272D" stroke="#FFFFFF" stroke-width="2" letter-spacing="3">
      <textPath href="#text-arc-top" startOffset="50%" text-anchor="middle">
        EMEK CİĞERCİSİ
      </textPath>
    </text>

    <!-- MERKEZİ SIMGE: ÇAPRAZ BÖREKÇİ / KASAP BICAĞI VE SATIR -->
    <g id="crossed-knives" transform="translate(250, 220)">
      
      <!-- BIÇAK 1 (Sol Tarafa Bakan Bıçak) -->
      <g transform="rotate(-28) translate(-10, -70)">
        <!-- Bıçak Sapı -->
        <rect x="-12" y="50" width="24" height="80" fill="#8C1D18" stroke="#FFFFFF" stroke-width="2" rx="2" />
        <!-- Perçin / Perçin Noktaları -->
        <circle cx="0" cy="65" r="3.5" fill="#FFFFFF" />
        <circle cx="0" cy="90" r="3.5" fill="#FFFFFF" />
        <circle cx="0" cy="115" r="3.5" fill="#FFFFFF" />
        <!-- Bıçak Namlusu (Kesici Gövde) -->
        <path d="M -12,50 L -12,-50 Q -12,-85 22,-30 L 12,50 Z" fill="#C1272D" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="miter" />
        <path d="M -5,40 L -5,-35 Q -5,-65 12,-25 L 5,40 Z" fill="#FFFFFF" opacity="0.25" />
      </g>

      <!-- SATIR 2 (Sağ Tarafa Bakan Satır) -->
      <g transform="rotate(28) translate(10, -70)">
        <!-- Satır Sapı -->
        <rect x="-14" y="50" width="28" height="80" fill="#8C1D18" stroke="#FFFFFF" stroke-width="2" rx="2" />
        <!-- Perçin Noktaları -->
        <circle cx="0" cy="65" r="3.5" fill="#FFFFFF" />
        <circle cx="0" cy="90" r="3.5" fill="#FFFFFF" />
        <circle cx="0" cy="115" r="3.5" fill="#FFFFFF" />
        <!-- Satır Namlusu -->
        <path d="M -14,50 L -14,-75 L 35,-75 Q 40,20 -14,50 Z" fill="#C1272D" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="miter" />
        <!-- Satır Asma Deliği -->
        <circle cx="20" cy="-55" r="5" fill="#2E2C2A" stroke="#FFFFFF" stroke-width="2" />
        <path d="M -5,40 L -5,-60 L 25,-60 Q 28,10 -5,40 Z" fill="#FFFFFF" opacity="0.25" />
      </g>

    </g>

    <!-- MÜHÜR KURDELESİ / 1993 BANNER -->
    <g id="banner-1993" transform="translate(250, 310)">
      <!-- Kurdele Arka Fonu -->
      <path d="M -130,0 Q 0,-20 130,0 Q 110,35 0,30 Q -110,35 -130,0 Z" fill="#8C1D18" stroke="#FFFFFF" stroke-width="3" />
      <!-- Kurdele Uçları -->
      <path d="M -130,0 L -155,-10 L -145,15 L -160,30 L -120,22 Z" fill="#6B6863" stroke="#FFFFFF" stroke-width="2" />
      <path d="M 130,0 L 155,-10 L 145,15 L 160,30 L 120,22 Z" fill="#6B6863" stroke="#FFFFFF" stroke-width="2" />
      <!-- Yıl Yazısı -->
      <text x="0" y="19" font-family="'Outfit', 'Impact', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
        1993
      </text>
    </g>

    <!-- ALT METİN: ET VE SAKATAT -->
    <g id="bottom-text" transform="translate(250, 390)">
      <text x="0" y="0" font-family="'Outfit', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#C1272D" stroke="#FFFFFF" stroke-width="2" text-anchor="middle" letter-spacing="4">
        ET VE SAKATAT
      </text>
    </g>

  </g>
</svg>
